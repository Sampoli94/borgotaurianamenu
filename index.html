  :root:not([data-theme="light"]){
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0a0d12;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Libre Franklin', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    overscroll-behavior: none;
  }
  h1,h2,h3,.serif{
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  #stage{
    position: fixed; inset:0;
    overflow:hidden;
    background: var(--bg);
  }

  #track{
    position:absolute; inset:0;
    perspective: 2200px;
    touch-action: pan-y;
    user-select: none;
  }
  .page{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center;
    padding: max(28px, env(safe-area-inset-top)) 7vw max(96px, env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-origin: left center;
    transition: transform 0.95s cubic-bezier(.45,.05,.29,1), box-shadow 0.95s;
  }
  .page.flip-turning{
    box-shadow: -46px 0 70px rgba(0,0,0,0.38);
  }
  .page:not(.cover){
    background: var(--paper);
    --ink: var(--paper-ink);
    --ink-dim: var(--paper-ink-dim);
    --line: var(--paper-line);
    --gold: var(--paper-gold);
    --gold-bright: var(--paper-price);
  }
  .cover-blur{
    position:absolute; inset:-30px;
    background-image: var(--cover-photo);
    background-size: cover;
    background-position: center center;
    filter: blur(34px) brightness(0.5);
    z-index:0;
  }
  .cover-photo-full{
    position:absolute; inset:0;
    background-image: var(--cover-photo);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center center;
    z-index:1;
  }
  .page.cover::before{
    content:"";
    position:absolute; inset:0;
    z-index:2;
    background: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.0) 20%, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.32) 84%, rgba(0,0,0,0.55) 100%);
  }
  .page.cover .page-inner{
    position: relative;
    z-index: 3;
    margin: 0;
    display:flex; flex-direction:column;
    justify-content:space-between;
    align-items:center;
    height:100%;
  }
  .page-inner{
    width:100%; max-width: 640px;
    margin: auto 0;
    padding: 24px 0;
  }

  /* ---------- Cover ---------- */
  .cover{ justify-content:space-between; text-align:center; padding-top: max(64px, env(safe-area-inset-top)); padding-bottom: max(64px, env(safe-area-inset-bottom)); }
  .cover .cover-top, .cover .cover-bottom{ width:100%; }
  .cover .mark{
    width:46px; height:46px; margin:0 auto 22px;
    opacity:0.9;
  }
  .cover h1{
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    line-height: 1.02;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .cover h1 em{
    font-style: italic; color: var(--gold-bright);
  }
  .cover .kicker{
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin: 0 0 30px;
    font-weight: 600;
  }
  .rule{
    width:64px; height:1px; margin:22px auto;

/* -------- RENDER (effetto sfoglia libro) -------- */
const track = document.getElementById('track');
track.innerHTML = pagesData.join('');
const pages = Array.from(document.querySelectorAll('.page'));
const total = pages.length;
let idx = 0;
let animating = false;

const pagecount = document.getElementById('pagecount');
const progressfill = document.getElementById('progressfill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function updateUI(){
  pagecount.textContent = String(idx+1).padStart(2,'0') + ' — ' + String(total).padStart(2,'0');
  progressfill.style.width = ((idx+1)/total*100) + '%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === total - 1;
}

/* assegna transform/z-index coerenti con la pagina corrente (stato "a riposo") */
function layout(instant){
  pages.forEach((p, i)=>{
    if(instant){ p.style.transition = 'none'; }
    if(i < idx){
      p.style.zIndex = i - total;
      p.style.transform = 'rotateY(-176deg)';
    } else {
      p.style.zIndex = total - i;
      p.style.transform = 'rotateY(0deg)';
    }
    p.classList.remove('flip-turning');
    if(instant){ p.offsetHeight; p.style.transition = ''; }
  });
}
layout(true);
updateUI();

function flipTo(newIdx, direction){
  if(animating || newIdx < 0 || newIdx > total - 1 || newIdx === idx) return;
  animating = true;
  if(direction === 1){
    const fromEl = pages[idx];
    fromEl.style.zIndex = 999;
    fromEl.classList.add('flip-turning');
    fromEl.style.transform = 'rotateY(-176deg)';
  } else {
    const toEl = pages[newIdx];
    toEl.style.zIndex = 999;
    toEl.classList.add('flip-turning');
    toEl.style.transition = 'none';
    toEl.style.transform = 'rotateY(-176deg)';
    toEl.offsetHeight;
    toEl.style.transition = '';
    toEl.style.transform = 'rotateY(0deg)';
  }
  idx = newIdx;
  updateUI();
  setTimeout(()=>{ layout(false); animating = false; }, 980);
}

function goTo(n){
  const n2 = Math.max(0, Math.min(total-1, n));
  if(n2 === idx) return;
  flipTo(n2, n2 > idx ? 1 : -1);
}

prevBtn.addEventListener('click', ()=>goTo(idx-1));
nextBtn.addEventListener('click', ()=>goTo(idx+1));
document.getElementById('startBtn').addEventListener('click', ()=>goTo(1));

/* trascinamento: rileva l'intenzione orizzontale e sfoglia in avanti/indietro,
   lasciando libero lo scroll verticale dentro ogni pagina */
let dragging = false, lockedAxis = null, startX = 0, startY = 0;

function dragStart(x, y){
  if(animating) return;
  dragging = true; lockedAxis = null;
  startX = x; startY = y;
}
function dragMove(x, y, ev){
  if(!dragging) return;
  const dx = x - startX, dy = y - startY;
  if(lockedAxis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
    lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if(lockedAxis === 'x' && ev && ev.cancelable) ev.preventDefault();
}
function dragEnd(x){
  if(!dragging) return;
  dragging = false;
  if(lockedAxis === 'x'){
    const dx = x - startX;
    const threshold = 60;
    if(dx < -threshold) goTo(idx+1);
    else if(dx > threshold) goTo(idx-1);
  }
  lockedAxis = null;
}

if(window.PointerEvent){
  track.addEventListener('pointerdown', (e)=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    dragStart(e.clientX, e.clientY);
  });
  track.addEventListener('pointermove', (e)=>{ dragMove(e.clientX, e.clientY, e); });
  track.addEventListener('pointerup', (e)=>{ dragEnd(e.clientX); });
  track.addEventListener('pointercancel', (e)=>{ dragEnd(e.clientX); });
} else {
  track.addEventListener('touchstart', (e)=>{
    const t = e.touches[0]; dragStart(t.clientX, t.clientY);
  }, {passive:true});
  track.addEventListener('touchmove', (e)=>{
    const t = e.touches[0]; dragMove(t.clientX, t.clientY, e);
  }, {passive:false});
  track.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0]; dragEnd(t.clientX);
  }, {passive:true});
}

window.addEventListener('resize', ()=>{ layout(true); });

/* tastiera (desktop) */
window.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goTo(idx+1);
  if(e.key === 'ArrowLeft') goTo(idx-1);
});

</script>
